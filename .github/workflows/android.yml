name: Android CI

# Runs on every push so each branch gets tested before merging.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Java 17, matching jvmTarget.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle dependencies between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew sometimes loses execute permission after checkout.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # No release signing set up yet, debug build only.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Keep the report even if tests fail, so we can see what broke.
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
